# Continuous integration on Linux: quality gate for both flavors and unsigned release APKs.
# No secrets are used: release builds are unsigned because keystore.properties is not in the repo.
# The APKs are compared with local (signed) builds to check that builds are reproducible across machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (tag in the comment) for supply-chain safety.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Quality gate (both flavors)
        run: >
          ./gradlew --console=plain
          ktlintCheck
          testGithubDebugUnitTest testStoreDebugUnitTest
          lintGithubDebug lintStoreDebug
          licenseeAndroidGithubRelease licenseeAndroidStoreRelease

      - name: Unsigned release APKs
        run: ./gradlew --console=plain assembleGithubRelease assembleStoreRelease

      - name: Checksums
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk app/build/outputs/apk/store/release/*.apk out/
          (cd out && sha256sum *.apk | tee SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-apks
          path: out/
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
